<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>냠냠 게임 천국</title>
<style>
  :root{--bg:#1b0e18;--gold:#ffd166;--pink:#ff5d8f;--mint:#3ddc97;--sky:#4cc9f0}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:#fff;
    font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;user-select:none;-webkit-user-select:none}
  #bg{position:fixed;inset:0;width:100vw;height:100vh;z-index:0}
  main{position:relative;z-index:1;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(18px,4vh,40px);padding:16px;overflow-y:auto}
  h1{margin:0;font-size:clamp(34px,8vw,76px);font-weight:900;letter-spacing:1px;white-space:nowrap;text-align:center;
    filter:drop-shadow(0 6px 0 rgba(30,8,24,.9))}
  h1 span{display:inline-block;animation:bounce 1.6s ease-in-out infinite;-webkit-text-stroke:2px rgba(30,8,24,.6)}
  @keyframes bounce{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-14px) rotate(3deg)}}
  .sub{margin-top:-10px;opacity:.85;font-weight:700;font-size:clamp(13px,2.4vw,18px);text-align:center}
  .cards{display:flex;gap:clamp(14px,2.5vw,28px);flex-wrap:wrap;justify-content:center;width:100%;max-width:1100px}
  .card{position:relative;flex:1 1 260px;max-width:320px;min-height:clamp(150px,34vh,300px);border:none;cursor:pointer;color:#fff;
    border-radius:26px;padding:22px 18px;text-align:center;font:inherit;overflow:hidden;
    background:linear-gradient(160deg,var(--c1),var(--c2));
    box-shadow:0 14px 0 rgba(0,0,0,.35),0 0 0 3px rgba(255,255,255,.15) inset;
    animation:float 3.2s ease-in-out infinite;animation-delay:var(--d);
    transition:transform .25s cubic-bezier(.34,1.56,.64,1),box-shadow .25s}
  @keyframes float{0%,100%{transform:translateY(0) rotate(-1.2deg)}50%{transform:translateY(-10px) rotate(1.2deg)}}
  .card:hover,.card:focus-visible{animation-play-state:paused;transform:translateY(-12px) scale(1.06) rotate(0);
    box-shadow:0 22px 0 rgba(0,0,0,.3),0 0 40px var(--c1),0 0 0 3px rgba(255,255,255,.4) inset;outline:none}
  .card::before{content:"";position:absolute;inset:-50%;background:conic-gradient(from 0deg,transparent 0 70%,rgba(255,255,255,.35) 80%,transparent 90%);
    animation:spin 4s linear infinite;opacity:0;transition:opacity .3s}
  .card:hover::before{opacity:1}
  @keyframes spin{to{transform:rotate(1turn)}}
  .card>*{position:relative}
  .icon{font-size:clamp(54px,10vh,92px);line-height:1.1;display:inline-block;animation:wobble 2.2s ease-in-out infinite;animation-delay:var(--d)}
  .card:hover .icon{animation:jelly .6s ease}
  @keyframes wobble{0%,100%{transform:rotate(-8deg) scale(1)}50%{transform:rotate(8deg) scale(1.08)}}
  @keyframes jelly{0%{transform:scale(1)}30%{transform:scale(1.35,.75)}50%{transform:scale(.8,1.25)}70%{transform:scale(1.15,.9)}100%{transform:scale(1)}}
  .name{font-size:clamp(20px,3vw,28px);font-weight:900;margin:8px 0 4px;text-shadow:0 3px 0 rgba(0,0,0,.35)}
  .desc{font-size:14px;font-weight:600;opacity:.92;line-height:1.45}
  .best{display:inline-block;margin-top:12px;padding:5px 12px;border-radius:99px;background:rgba(0,0,0,.3);font-size:13px;font-weight:800;color:var(--gold)}
  .play{position:absolute;right:14px;top:14px;width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,.25);display:grid;place-items:center;font-size:16px;
    animation:pulse 1.4s ease-in-out infinite}
  @keyframes pulse{0%,100%{transform:scale(1);box-shadow:0 0 0 0 rgba(255,255,255,.5)}50%{transform:scale(1.1);box-shadow:0 0 0 10px rgba(255,255,255,0)}}
  #wipe{position:fixed;inset:0;z-index:5;pointer-events:none;background:radial-gradient(circle at var(--x) var(--y),var(--wc) 0,var(--wc) var(--r),transparent calc(var(--r) + 1px));--r:0px}
  @media (max-width:640px){
    main{justify-content:flex-start;padding-top:28px}
    .card{flex:1 1 100%;max-width:440px;min-height:0;display:grid;grid-template-columns:auto 1fr;text-align:left;align-items:center;gap:4px 16px;padding:16px 18px}
    .icon{grid-row:span 3;font-size:56px}
    .name{margin:0}.best{margin-top:4px;justify-self:start}
    .play{display:none}
  }
  @media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>
<canvas id="bg"></canvas>
<main>
  <h1 id="title" aria-label="냠냠 게임 천국"></h1>
  <div class="sub">🍽️ 오늘은 어떤 요리 게임을 해볼까요?</div>
  <div class="cards">
    <button class="card" data-href="serving.html" data-key="servingKingBest" style="--c1:#ff5d8f;--c2:#8a1f52;--d:0s">
      <div class="play">▶</div>
      <div class="icon">🍣</div>
      <div class="name">빙글빙글 서빙왕</div>
      <div class="desc">돌아가는 식탁의 손님에게<br>레일 위 음식을 골라 서빙!</div>
      <div class="best"></div>
    </button>
    <button class="card" data-href="rhythm.html" data-key="kitchenRhythmBest" style="--c1:#ffb703;--c2:#a14d00;--d:-1.1s">
      <div class="play">▶</div>
      <div class="icon">🥁</div>
      <div class="name">주방 리듬 쿡</div>
      <div class="desc">비트에 맞춰 재료를 탭!<br>썰고 굽고 끓이는 리듬 요리</div>
      <div class="best"></div>
    </button>
    <button class="card" data-href="runner.html" data-key="deliveryRunnerBest" style="--c1:#3ddc97;--c2:#0b6b5a;--d:-2.2s">
      <div class="play">▶</div>
      <div class="icon">🛵</div>
      <div class="name">배달 러너</div>
      <div class="desc">장애물을 넘고 음식을 챙겨<br>손님 집까지 쌩쌩 배달!</div>
      <div class="best"></div>
    </button>
  </div>
</main>
<div id="wipe"></div>
<script>
'use strict';
// title letters
const title = '냠냠 게임 천국', h1 = document.getElementById('title');
[...title].forEach((ch, i) => {
  const s = document.createElement('span');
  s.textContent = ch === ' ' ? ' ' : ch;
  s.style.animationDelay = (-i * 0.15) + 's';
  s.style.color = `hsl(${i * 45 + 330},95%,68%)`;
  h1.appendChild(s);
});
// best scores
document.querySelectorAll('.card').forEach(c => {
  let b = 0; try { b = +localStorage.getItem(c.dataset.key) || 0; } catch (e) {}
  c.querySelector('.best').textContent = b ? `🏆 최고 ${b.toLocaleString()}` : '✨ NEW';
});

// background canvas
const cv = document.getElementById('bg'), ctx = cv.getContext('2d');
let W, H, DPR;
const FOODS = ['🍣','🍕','🍔','🌮','🍜','🍩','🍰','🍤','🥟','🍙','🍗','🥕','🍅','🥚','🛵','🍱','🧁','🥁'];
const EF = '"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif';
const rand = (a, b) => a + Math.random() * (b - a);
let floaters = [], bokeh = [], parts = [], t = 0;
function resize() {
  DPR = Math.min(2, devicePixelRatio || 1); W = innerWidth; H = innerHeight;
  cv.width = W * DPR; cv.height = H * DPR;
}
resize(); addEventListener('resize', resize);
for (let i = 0; i < 22; i++) floaters.push({ x: rand(0, 1), y: rand(0, 1), s: rand(22, 48), vy: rand(-0.03, -0.012), r: rand(0, 6), vr: rand(-0.6, 0.6), e: FOODS[i % FOODS.length], ph: rand(0, 6) });
for (let i = 0; i < 26; i++) bokeh.push({ x: rand(0, 1), y: rand(0, 1), r: rand(10, 60), vy: rand(-0.02, -0.005), hue: [20, 40, 330, 280, 190, 150][i % 6], ph: rand(0, 6) });
let mx = -999, my = -999;
addEventListener('pointermove', e => { mx = e.clientX; my = e.clientY; if (Math.random() < 0.35) spark(mx, my, 1); });
function spark(x, y, n, big) {
  for (let i = 0; i < n; i++) {
    const a = rand(0, Math.PI * 2), s = big ? rand(150, 650) : rand(20, 90);
    parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: rand(0.5, 1.1), t: 0, size: big ? rand(4, 9) : rand(2, 4), hue: rand(0, 360), conf: big && Math.random() < 0.5, rot: rand(0, 6) });
  }
}
function star(x, y, r, rot) {
  ctx.beginPath();
  for (let i = 0; i < 10; i++) { const a = rot + i * Math.PI / 5, q = i % 2 ? r * .45 : r; ctx.lineTo(x + Math.cos(a) * q, y + Math.sin(a) * q); }
  ctx.closePath();
}
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now; t += dt;
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, '#3a1631'); g.addColorStop(.55, '#5c2335'); g.addColorStop(1, '#1b0e18');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  // rotating rays
  ctx.save(); ctx.translate(W / 2, H * 0.22); ctx.rotate(t * 0.08);
  for (let i = 0; i < 20; i++) { const a = i / 20 * Math.PI * 2; ctx.fillStyle = 'rgba(255,210,170,0.05)'; ctx.beginPath(); ctx.moveTo(0, 0); ctx.arc(0, 0, Math.max(W, H) * 1.3, a, a + Math.PI / 20); ctx.fill(); }
  ctx.restore();
  ctx.save(); ctx.globalCompositeOperation = 'lighter';
  for (const b of bokeh) {
    b.y += b.vy * dt; if (b.y < -0.1) { b.y = 1.1; b.x = rand(0, 1); }
    const x = b.x * W, y = b.y * H, a = 0.07 + 0.05 * Math.sin(t * 1.5 + b.ph);
    const rg = ctx.createRadialGradient(x, y, 0, x, y, b.r);
    rg.addColorStop(0, `hsla(${b.hue},90%,70%,${a})`); rg.addColorStop(1, `hsla(${b.hue},90%,70%,0)`);
    ctx.fillStyle = rg; ctx.beginPath(); ctx.arc(x, y, b.r, 0, Math.PI * 2); ctx.fill();
  }
  ctx.restore();
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  for (const f of floaters) {
    f.y += f.vy * dt; f.r += f.vr * dt; if (f.y < -0.08) { f.y = 1.08; f.x = rand(0, 1); }
    let x = f.x * W + Math.sin(t + f.ph) * 20, y = f.y * H;
    const d = Math.hypot(x - mx, y - my);
    if (d < 120) { const k = (120 - d) / 120; x += (x - mx) / d * k * 40; y += (y - my) / d * k * 40; }
    ctx.save(); ctx.globalAlpha = 0.45; ctx.translate(x, y); ctx.rotate(f.r);
    ctx.font = `${f.s}px ${EF}`; ctx.fillText(f.e, 0, 0); ctx.restore();
  }
  for (const p of parts) {
    p.t += dt; p.vx *= 1 - 2 * dt; p.vy = p.vy * (1 - 2 * dt) + (p.conf ? 400 : 60) * dt; p.x += p.vx * dt; p.y += p.vy * dt; p.rot += dt * 8;
    const a = 1 - p.t / p.life; ctx.globalAlpha = Math.max(0, a); ctx.fillStyle = `hsl(${p.hue},95%,70%)`;
    if (p.conf) { ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot); ctx.scale(1, Math.cos(p.t * 12)); ctx.fillRect(-p.size / 2, -p.size / 4, p.size, p.size / 2); ctx.restore(); }
    else { star(p.x, p.y, p.size, p.rot); ctx.fill(); }
  }
  ctx.globalAlpha = 1;
  parts = parts.filter(p => p.t < p.life);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

// card click → burst + circular wipe → navigate
const wipe = document.getElementById('wipe');
let going = false;
document.querySelectorAll('.card').forEach(c => {
  c.addEventListener('pointerenter', () => { const r = c.getBoundingClientRect(); spark(r.left + r.width / 2, r.top + 30, 14); });
  c.addEventListener('click', () => {
    if (going) return; going = true;
    const r = c.getBoundingClientRect(), x = r.left + r.width / 2, y = r.top + r.height / 2;
    spark(x, y, 90, true);
    c.style.transition = 'transform .35s cubic-bezier(.34,1.56,.64,1)';
    c.style.animation = 'none'; c.style.transform = 'scale(1.15) rotate(-3deg)';
    wipe.style.setProperty('--x', x + 'px'); wipe.style.setProperty('--y', y + 'px');
    wipe.style.setProperty('--wc', getComputedStyle(c).getPropertyValue('--c2'));
    const R = Math.hypot(Math.max(x, W - x), Math.max(y, H - y)) + 20, t0 = performance.now() + 250;
    (function grow(now) {
      const k = Math.max(0, Math.min(1, (now - t0) / 450));
      wipe.style.setProperty('--r', (R * k * k) + 'px');
      if (k < 1) requestAnimationFrame(grow); else location.href = c.dataset.href;
    })(performance.now());
  });
});
// reset if returning via bfcache
addEventListener('pageshow', e => { if (e.persisted) { going = false; wipe.style.setProperty('--r', '0px'); document.querySelectorAll('.card').forEach(c => { c.style.transform = ''; c.style.animation = ''; }); } });
</script>
</body>
</html>
