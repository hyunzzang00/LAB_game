<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>주방 리듬 쿡</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#140a18;touch-action:none;user-select:none;-webkit-user-select:none}
  canvas{display:block;width:100vw;height:100vh}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
'use strict';
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
let W = 0, H = 0, DPR = 1;
const TAU = Math.PI * 2;
const FF = '"Pretendard","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif';
const EF = '"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif';
const FOODS = ['🥕','🧅','🥩','🍅','🧄','🥚','🌶️','🥦','🍄','🧀','🐟','🦐','🥔','🌽'];
const DISHES = ['🍛','🍝','🍲','🥘','🍜','🍱','🥗','🍕','🌯','🍔','🥞','🍣'];
const LANES = [
  { icon: '🔪', name: '도마', color: '#ff5d8f' },
  { icon: '🍳', name: '프라이팬', color: '#ffb703' },
  { icon: '🍲', name: '냄비', color: '#4cc9f0' },
  { icon: '🔥', name: '오븐', color: '#ff6b35' },
];
const KEYS = { d: 0, f: 1, j: 2, k: 3, '1': 0, '2': 1, '3': 2, '4': 3, arrowleft: 0, arrowdown: 1, arrowup: 2, arrowright: 3 };
const WIN = { perfect: 0.05, great: 0.09, good: 0.14 };
const SONG_LEN = 90, BPMS = [108, 120, 134], APPROACH = [1.55, 1.35, 1.15];
const BEST_KEY = 'kitchenRhythmBest';

const rand = (a, b) => a + Math.random() * (b - a);
const pick = a => a[Math.floor(Math.random() * a.length)];
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const easeOutBack = t => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); };
const easeOutElastic = t => t <= 0 ? 0 : t >= 1 ? 1 : Math.pow(2, -10 * t) * Math.sin((t * 10 - 0.75) * TAU / 3) + 1;
const easeInOut = t => t < .5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;

/* ---------- drawing helpers ---------- */
const emojiCache = new Map();
function emo(e, px) {
  const s = clamp(Math.round(px / 8) * 8, 8, 256), k = e + '|' + s;
  let c = emojiCache.get(k);
  if (!c) {
    c = document.createElement('canvas'); const p = Math.ceil(s * 1.3); c.width = c.height = p;
    const g = c.getContext('2d'); g.font = `${s}px ${EF}`; g.textAlign = 'center'; g.textBaseline = 'middle';
    g.fillText(e, p / 2, p / 2 + s * 0.06); emojiCache.set(k, c);
  }
  return c;
}
function drawEmo(e, x, y, size, rot = 0, alpha = 1, sx = 1, sy = 1) {
  if (size <= 0.5 || alpha <= 0) return;
  const c = emo(e, size * DPR), w = size * 1.3;
  ctx.save(); ctx.globalAlpha *= alpha; ctx.translate(x, y); if (rot) ctx.rotate(rot);
  if (sx !== 1 || sy !== 1) ctx.scale(sx, sy);
  ctx.drawImage(c, -w / 2, -w / 2, w, w); ctx.restore();
}
function rr(x, y, w, h, r) {
  r = Math.max(0, Math.min(r, w / 2, h / 2));
  ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}
function starPath(x, y, r, rot) {
  ctx.beginPath();
  for (let i = 0; i < 10; i++) { const a = rot + i * Math.PI / 5 - Math.PI / 2, q = i % 2 ? r * 0.45 : r; ctx.lineTo(x + Math.cos(a) * q, y + Math.sin(a) * q); }
  ctx.closePath();
}
function txt(s, x, y, size, color, align = 'center', stroke = 0, weight = 900) {
  ctx.font = `${weight} ${size}px ${FF}`; ctx.textAlign = align; ctx.textBaseline = 'middle';
  if (stroke) { ctx.lineWidth = stroke; ctx.strokeStyle = 'rgba(25,8,28,.9)'; ctx.lineJoin = 'round'; ctx.strokeText(s, x, y); }
  ctx.fillStyle = color; ctx.fillText(s, x, y);
}

/* ---------- audio engine ---------- */
let AC = null, master = null, noiseBuf = null;
function initAudio() {
  if (!AC) {
    try {
      AC = new (window.AudioContext || window.webkitAudioContext)();
      const comp = AC.createDynamicsCompressor(); comp.connect(AC.destination);
      master = AC.createGain(); master.gain.value = 0.8; master.connect(comp);
      noiseBuf = AC.createBuffer(1, AC.sampleRate, AC.sampleRate);
      const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    } catch (e) { AC = null; }
  }
  if (AC && AC.state === 'suspended') AC.resume();
}
const mtof = m => 440 * Math.pow(2, (m - 69) / 12);
function osc(type, f, when, dur, vol, slideTo, filter) {
  if (!AC) return;
  const o = AC.createOscillator(), g = AC.createGain();
  o.type = type; o.frequency.setValueAtTime(f, when);
  if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, when + dur);
  g.gain.setValueAtTime(0.0001, when); g.gain.exponentialRampToValueAtTime(vol, when + 0.008);
  g.gain.exponentialRampToValueAtTime(0.0001, when + dur);
  let node = o;
  if (filter) { const f2 = AC.createBiquadFilter(); f2.type = 'lowpass'; f2.frequency.value = filter; node.connect(f2); node = f2; }
  node.connect(g).connect(master); o.start(when); o.stop(when + dur + 0.05);
}
function noise(when, dur, vol, type, freq, q = 1) {
  if (!AC) return;
  const s = AC.createBufferSource(), f = AC.createBiquadFilter(), g = AC.createGain();
  s.buffer = noiseBuf; f.type = type; f.frequency.value = freq; f.Q.value = q;
  g.gain.setValueAtTime(vol, when); g.gain.exponentialRampToValueAtTime(0.0001, when + dur);
  s.connect(f).connect(g).connect(master); s.start(when, Math.random() * 0.5); s.stop(when + dur + 0.05);
}
const drum = {
  kick: w => osc('sine', 160, w, 0.16, 0.9, 42),
  snare: (w, v = 0.35) => { noise(w, 0.14, v, 'highpass', 1200); osc('triangle', 220, w, 0.08, 0.2, 150); },
  hat: (w, v = 0.08) => noise(w, 0.04, v, 'highpass', 7500),
  clap: w => { noise(w, 0.1, 0.25, 'bandpass', 1800, 2); noise(w + 0.012, 0.1, 0.2, 'bandpass', 1800, 2); },
};
const laneSfx = [
  w => { noise(w, 0.05, 0.35, 'bandpass', 2600, 3); osc('square', 900, w, 0.03, 0.04); },
  w => { noise(w, 0.22, 0.18, 'highpass', 4500); osc('sawtooth', 300, w, 0.06, 0.04, 180); },
  w => osc('sine', 320, w, 0.12, 0.25, 760),
  w => { noise(w, 0.25, 0.25, 'lowpass', 700); osc('sine', 110, w, 0.15, 0.25, 60); },
];
function uiTone(f, d, type = 'triangle', v = 0.12, delay = 0, slide) {
  if (!AC) return; const w = AC.currentTime + delay; osc(type, f, w, d, v, slide ? f * slide : 0);
}

/* ---------- song + chart ---------- */
const ROOTS = [45, 41, 36, 43]; // Am F C G
const PENTA = [0, 3, 5, 7, 10, 12, 15];
let steps = [], notes = [], beats = [], songEnd = 0;
function buildSong() {
  steps = []; notes = []; beats = [];
  let t = 0, i = 0, stage = 0, mel = [];
  while (true) {
    const s = i % 16;
    if (s === 0) {
      if (t >= SONG_LEN) break;
      stage = t < 30 ? 0 : t < 60 ? 1 : 2;
      mel = [];
      for (let k = 0; k < 16; k++) mel.push(Math.random() < (k % 2 ? 0.25 : 0.55) ? pick(PENTA) : null);
    }
    const bpm = BPMS[stage], bar = Math.floor(i / 16);
    const st = { t, i, s, bar, stage, bpm, mel: mel[s] };
    steps.push(st);
    if (s % 4 === 0) beats.push(st);
    t += 60 / bpm / 4; i++;
  }
  songEnd = t;
  // chart
  const blocked = [0, 0, 0, 0]; let prevLane = -1, prevT = -9;
  for (const st of steps) {
    if (st.bar < 1 || st.t > songEnd - 1.2) continue;
    const beat = st.s % 4 === 0, eighth = st.s % 2 === 0 && !beat;
    const P = [[0.82, 0.14, 0], [0.88, 0.36, 0.04], [0.92, 0.5, 0.1]][st.stage];
    let p = beat ? P[0] : eighth ? P[1] : P[2];
    if (st.bar % 8 === 7) p *= 0.45;
    if (st.bar === 1 && !beat) p = 0;
    if (Math.random() > p) continue;
    const free = [0, 1, 2, 3].filter(l => blocked[l] <= st.t + 0.001);
    if (!free.length) continue;
    let cand = free.filter(l => l !== prevLane || st.t - prevT > 0.3); if (!cand.length) cand = free;
    const lane = pick(cand), bd = 60 / st.bpm;
    let hold = 0;
    if (beat && st.bar > 2 && Math.random() < [0.07, 0.1, 0.12][st.stage]) hold = bd * pick([1, 2]);
    addNote(st.t, lane, hold, st.stage); blocked[lane] = st.t + hold + 0.14;
    if (st.s === 0 && st.stage >= 1 && Math.random() < 0.3) {
      const f2 = free.filter(l => l !== lane);
      if (f2.length) { const l2 = pick(f2); addNote(st.t, l2, 0, st.stage); blocked[l2] = st.t + 0.14; }
    }
    prevLane = lane; prevT = st.t;
  }
}
function addNote(t, lane, hold, stage) {
  notes.push({ t, lane, hold, ap: APPROACH[stage], food: hold ? '🥖' : pick(FOODS), judged: false, holding: false, done: false, rot: rand(-0.3, 0.3) });
}
function playStep(st, w) {
  const s = st.s, g = st.stage, barDur = 60 / st.bpm * 4;
  if (s === 0 || s === 8 || (g >= 1 && s === 10) || (g === 2 && s === 14)) drum.kick(w);
  if (s === 4 || s === 12) { drum.snare(w); if (g === 2) drum.clap(w); }
  if (g === 2 && s === 15) drum.snare(w, 0.12);
  if (g === 0 ? s % 4 === 2 : g === 1 ? s % 2 === 0 : true) drum.hat(w, s % 4 === 2 ? 0.1 : 0.05);
  const root = ROOTS[st.bar % 4];
  if ([0, 3, 6, 8, 10, 14].includes(s)) osc('sawtooth', mtof(root - 12 + (s === 10 ? 12 : 0)), w, 0.18, 0.16, 0, 500);
  if (s === 0) [0, 3, 7].forEach(k => osc('triangle', mtof(root + 12 + k + (k === 3 && (st.bar % 4 === 1 || st.bar % 4 === 2) ? 1 : 0)), w, barDur * 0.9, 0.035));
  if (g >= 1 && st.mel != null) osc('square', mtof(root + 24 + st.mel), w, 0.12, 0.045, 0, 2400);
}

/* ---------- state ---------- */
const G = {
  mode: 'title', t: 0, startAt: 0, perfT: 0, sched: 0, vis: 0, score: 0, shownScore: 0, combo: 0, maxCombo: 0,
  health: 100, counts: { perfect: 0, great: 0, good: 0, miss: 0 }, dishes: 0, hitsForDish: 0, stage: 0,
  pulse: 0, barPulse: 0, zoom: 0, shake: 0, flash: 0, flashColor: '#fff', judge: null, comboPop: 0, overT: 0,
  best: 0, newBest: false, failed: false, fever: false, chefSad: 0, perfStreak: 0, countdown: -1, cdT: 0,
};
try { G.best = +localStorage.getItem(BEST_KEY) || 0; } catch (e) {}
let parts = [], texts = [], banners = [], eq = new Array(28).fill(0), laneFlash = [0, 0, 0, 0], laneHeld = [false, false, false, false];
const L = {};
const ptr = { x: -999, y: -999 };
const touches = new Map();

function songTime() { return AC ? AC.currentTime - G.startAt : performance.now() / 1000 - G.perfT; }
function resize() {
  DPR = Math.min(2, window.devicePixelRatio || 1); W = innerWidth; H = innerHeight;
  cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
  L.lw = Math.min(W / 4.4, 108); L.x0 = W / 2 - L.lw * 2; L.top = 70; L.hitY = H - Math.max(90, H * 0.14);
  L.u = clamp(Math.min(W / 900, H / 700), 0.62, 1.25);
  L.ns = L.lw * 0.52;
  const side = L.x0;
  if (side > 150) { L.chefX = side / 2; L.chefY = H * 0.55; L.chefS = clamp(side * 0.45, 60, 120); }
  else { L.chefX = 34; L.chefY = 112; L.chefS = 42; }
}
function laneX(l) { return L.x0 + L.lw * (l + 0.5); }

function start() {
  initAudio();
  Object.assign(G, { mode: 'play', score: 0, shownScore: 0, combo: 0, maxCombo: 0, health: 100, counts: { perfect: 0, great: 0, good: 0, miss: 0 },
    dishes: 0, hitsForDish: 0, stage: 0, sched: 0, vis: 0, judge: null, overT: 0, newBest: false, failed: false, fever: false, perfStreak: 0, countdown: -1 });
  parts = []; texts = []; banners = [];
  buildSong();
  G.startAt = AC ? AC.currentTime + 0.15 : 0; G.perfT = performance.now() / 1000 + 0.15;
}
function endGame(failed) {
  G.mode = 'over'; G.overT = 0; G.failed = failed;
  if (!failed && G.score > G.best) { G.best = G.score; G.newBest = true; try { localStorage.setItem(BEST_KEY, G.best); } catch (e) {} }
  if (failed) { banner('요리 실패…', '체력이 바닥났어요', '#ff6b81'); [392, 330, 262].forEach((f, i) => uiTone(f, 0.3, 'sawtooth', 0.08, i * 0.15)); }
  else [523, 659, 784, 1047, 1319, 1568].forEach((f, i) => uiTone(f, 0.25, 'triangle', 0.1, i * 0.09));
}
function accuracy() {
  const c = G.counts, n = c.perfect + c.great + c.good + c.miss;
  return n ? (c.perfect + c.great * 0.7 + c.good * 0.4) / n : 1;
}

/* ---------- effects ---------- */
function P(o) { if (parts.length > 900) parts.shift(); parts.push(Object.assign({ x: 0, y: 0, vx: 0, vy: 0, g: 0, life: 1, t: 0, size: 4, color: '#fff', rot: 0, vr: 0, type: 'dot', drag: 0 }, o)); }
function burst(x, y, n, colors, spd = 300, type = 'dot', g = 250) {
  for (let i = 0; i < n; i++) {
    const a = rand(0, TAU), s = rand(spd * 0.3, spd);
    P({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - (type === 'conf' ? 150 : 0), g: type === 'conf' ? 520 : g, life: rand(0.5, 1.1),
      size: type === 'conf' ? rand(4, 9) : rand(3, 7), color: pick(colors), type, rot: rand(0, TAU), vr: rand(-12, 12), drag: type === 'conf' ? 1.2 : 2.4 });
  }
}
function ring(x, y, color, grow, life = 0.4, w = 5) { P({ type: 'ring', x, y, size: 8, grow, life, color, w }); }
function addText(x, y, str, color, size = 24, life = 1) { texts.push({ x, y, str, color, size, t: 0, life }); }
function banner(str, sub, color) { banners.length = 0; banners.push({ str, sub, color, t: 0, life: 1.8 }); }
function laneFx(l, q) {
  const x = laneX(l), y = L.hitY, c = LANES[l].color;
  ring(x, y, c, L.lw * 0.7, 0.35, 5);
  if (q === 'perfect') { ring(x, y, '#fff', L.lw * 1.0, 0.45, 3); burst(x, y, 8, ['#fff', '#ffe066'], 260, 'star', 0); }
  if (l === 0) for (let i = 0; i < 7; i++) P({ type: 'conf', x, y: y - 10, vx: rand(-260, 260), vy: rand(-380, -160), g: 900, life: 0.8, size: rand(5, 9), color: pick(['#ff9f1c', '#7bd389', '#ff5d8f', '#fff3b0']), rot: rand(0, TAU), vr: rand(-20, 20), drag: 0.5 });
  if (l === 1) {
    for (let i = 0; i < 9; i++) P({ type: 'dot', x: x + rand(-L.lw * 0.3, L.lw * 0.3), y, vx: rand(-40, 40), vy: rand(-320, -150), g: 200, life: 0.6, size: rand(3, 6), color: pick(['#ffb703', '#ff6b35', '#ffe066']), drag: 1 });
    for (let i = 0; i < 3; i++) P({ type: 'steam', x: x + rand(-15, 15), y: y - 20, vy: rand(-80, -40), life: 1, size: rand(8, 12) });
  }
  if (l === 2) for (let i = 0; i < 8; i++) P({ type: 'bubble', x: x + rand(-L.lw * 0.3, L.lw * 0.3), y: y - rand(0, 20), vx: rand(-20, 20), vy: rand(-220, -90), life: rand(0.6, 1), size: rand(4, 10), color: '#9be7ff', drag: 0.5, ph: rand(0, TAU) });
  if (l === 3) {
    for (let i = 0; i < 12; i++) { const a = rand(-Math.PI, 0), s = rand(200, 480); P({ type: 'spark', x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, g: 500, life: 0.5, size: 2, color: pick(['#ffd166', '#ff6b35', '#fff']), drag: 1.5 }); }
    drawFlame(x, y);
  }
}
function drawFlame(x, y) { for (let i = 0; i < 5; i++) P({ type: 'emo', e: '🔥', x: x + rand(-20, 20), y: y - 10, vx: rand(-30, 30), vy: rand(-200, -100), life: 0.5, size: L.lw * 0.25, vr: rand(-3, 3) }); }

/* ---------- judging ---------- */
function press(l) {
  if (G.mode !== 'play') return;
  laneHeld[l] = true; laneFlash[l] = 1;
  const now = songTime();
  let best = null, bd = 1e9;
  for (const n of notes) {
    if (n.judged || n.lane !== l) continue;
    const d = Math.abs(n.t - now);
    if (d <= WIN.good && d < bd) { bd = d; best = n; }
    if (n.t - now > WIN.good) break;
  }
  if (!best) { P({ type: 'ring', x: laneX(l), y: L.hitY, size: 6, grow: L.lw * 0.3, life: 0.2, color: 'rgba(255,255,255,.5)', w: 2 }); return; }
  const q = bd <= WIN.perfect ? 'perfect' : bd <= WIN.great ? 'great' : 'good';
  best.judged = true;
  if (best.hold) best.holding = true; else best.done = true;
  if (AC) laneSfx[l](AC.currentTime);
  hit(q, l, best);
}
function release(l) {
  laneHeld[l] = false;
  if (G.mode !== 'play') return;
  const now = songTime();
  for (const n of notes) {
    if (n.lane === l && n.holding) {
      n.holding = false; n.done = true;
      if (n.t + n.hold - now > 0.13) miss(l, '놓쳤어요!');
      else holdDone(n);
    }
  }
}
function holdDone(n) {
  n.holding = false; n.done = true;
  hit('perfect', n.lane, n, true);
  burst(laneX(n.lane), L.hitY, 16, ['#ffd166', '#fff3b0', '#fff'], 340, 'star', 0);
}
function hit(q, l, n, isTail) {
  G.counts[q]++; G.combo++; G.maxCombo = Math.max(G.maxCombo, G.combo); G.comboPop = 1;
  G.health = Math.min(100, G.health + (q === 'perfect' ? 3 : q === 'great' ? 2 : 1));
  const wasFever = G.fever; G.fever = G.combo >= 30;
  if (G.fever && !wasFever) { banner('🔥 FEVER 🔥', '점수 2배!', '#ff5d8f'); burst(W / 2, H * 0.45, 60, ['#ff5d8f', '#ffd166', '#3ddc97', '#4cc9f0', '#b197fc'], 650, 'conf'); G.flash = 0.35; G.flashColor = '#ff9ec7'; }
  let pts = { perfect: 300, great: 200, good: 100 }[q] * (1 + Math.min(G.combo, 50) * 0.02);
  if (G.fever) pts *= 2;
  G.score += Math.round(pts);
  G.judge = { q, t: 0 };
  laneFx(l, q);
  if (q === 'perfect') { G.perfStreak++; if (G.perfStreak % 10 === 0) { G.zoom = 1; addText(W / 2, L.hitY - 170, `PERFECT x${G.perfStreak}!`, '#ffe066', 30 * L.u + 6); } }
  else G.perfStreak = 0;
  if (!isTail) {
    P({ type: 'emo', e: n.food, x: laneX(l), y: L.hitY, vx: rand(-60, 60), vy: -380, g: 1100, life: 0.6, size: L.ns, vr: rand(-12, 12) });
    G.hitsForDish++;
    if (G.hitsForDish >= 16) { G.hitsForDish = 0; dishDone(); }
  }
}
function miss(l, msg) {
  G.counts.miss++; G.combo = 0; G.perfStreak = 0; G.fever = false;
  G.health -= 8; G.shake = 8; G.chefSad = 0.8; G.flash = 0.18; G.flashColor = '#ff2244';
  G.judge = { q: 'miss', t: 0 };
  if (msg) addText(laneX(l), L.hitY - 60, msg, '#ff6b81', 18 * L.u + 4, 0.8);
  P({ type: 'emo', e: '💨', x: laneX(l), y: L.hitY, vy: -60, life: 0.6, size: L.ns * 0.7 });
  if (G.health <= 0) { G.health = 0; endGame(true); }
}
function dishDone() {
  G.dishes++;
  const d = DISHES[(G.dishes - 1) % DISHES.length];
  P({ type: 'dish', e: d, x: L.chefX, y: L.chefY - L.chefS * 0.6, sx: L.chefX, sy: L.chefY - L.chefS * 0.6, life: 1.4, size: L.chefS * 0.8 });
  burst(L.chefX, L.chefY - L.chefS * 0.5, 40, ['#ff5d8f', '#ffd166', '#3ddc97', '#4cc9f0', '#b197fc'], 450, 'conf');
  addText(L.chefX, L.chefY - L.chefS * 1.3, `${d} 요리 완성!`, '#ffd166', 20 * L.u + 6, 1.4);
  G.score += 1000 * (G.fever ? 2 : 1);
  [784, 988, 1175, 1568].forEach((f, i) => uiTone(f, 0.16, 'sine', 0.08, i * 0.06));
}

/* ---------- update ---------- */
function update(dt) {
  G.t += dt;
  if (G.mode === 'play') {
    const now = songTime();

  ctx.fillStyle = 'rgba(15,5,20,.75)'; rr(W / 2 - bw / 2, by, bw, bh, 18); ctx.fill();
  ctx.strokeStyle = 'rgba(255,209,102,.5)'; ctx.lineWidth = 2; ctx.stroke();
  const fs = clamp(14 * u + 2, 12, 17), lines = [
    ['🎵  재료가 판정선에 닿을 때 레인을 탭!', '#fff'],
    ['⌨️  키보드 D F J K · 🥖 바게트는 길게 누르기', '#fff'],
    ['✨  PERFECT 연속 · 16개 성공마다 요리 완성', '#7CFFB2'],
    ['🔥  30콤보 FEVER · MISS가 쌓이면 실패!', '#ffd166'],
  ];
  lines.forEach((l, i) => txt(l[0], W / 2, by + 22 + i * (bh - 28) / 4 + 4, fs, l[1], 'center', 0, 700));
  const p = 1 + Math.sin(G.t * 6) * 0.06;
  ctx.save(); ctx.translate(W / 2, by + bh + 42 * u); ctx.scale(p, p); txt('👆 탭하여 시작', 0, 0, 26 * u + 4, '#fff', 'center', 7, 900); ctx.restore();
  if (G.best) txt(`최고 점수 ${G.best.toLocaleString()}`, W / 2, by + bh + 80 * u, 14 * u + 2, '#ffd166', 'center', 4, 800);
}
function drawOver() {
  const k = Math.min(1, G.overT / 0.6), u = L.u;
  ctx.fillStyle = `rgba(15,5,20,${0.7 * k})`; ctx.fillRect(0, 0, W, H);
  const pw = Math.min(W - 32, 420), ph = 350 * u + 40;
  ctx.save(); ctx.translate(W / 2, H / 2); const s = easeOutElastic(k); ctx.scale(s, s);
  ctx.fillStyle = '#24112c'; rr(-pw / 2, -ph / 2, pw, ph, 24); ctx.fill(); ctx.strokeStyle = '#ffd166'; ctx.lineWidth = 3; ctx.stroke();
  const acc = accuracy();
  const grade = G.failed ? 'F' : acc >= 0.95 ? 'S' : acc >= 0.85 ? 'A' : acc >= 0.7 ? 'B' : 'C';
  const stars = { S: 3, A: 2, B: 1, C: 0, F: 0 }[grade];
  txt(G.failed ? '요리 실패!' : '오늘의 코스 완성!', 0, -ph / 2 + 36 * u, 26 * u + 4, '#ffd166', 'center', 6, 900);
  const gk = clamp((G.overT - 0.5) / 0.5, 0, 1);
  if (gk > 0) {
    ctx.save(); ctx.translate(0, -ph / 2 + 105 * u); ctx.scale(easeOutElastic(gk) * 1, easeOutElastic(gk)); ctx.rotate((1 - gk) * 2);
    const gc = { S: `hsl(${(G.t * 200) % 360},100%,68%)`, A: '#7CFFB2', B: '#4cc9f0', C: '#fff', F: '#ff4d6d' }[grade];
    txt(grade, 0, 0, 74 * u + 8, gc, 'center', 10, 900); ctx.restore();
  }
  for (let i = 0; i < 3; i++) {
    const st = clamp((G.overT - 0.9 - i * 0.25) / 0.35, 0, 1), on = i < stars && st > 0;
    drawEmo(on ? '⭐' : '☆', (i - 1) * 48 * u, -ph / 2 + 165 * u, 36 * u * (on ? easeOutElastic(st) : 1), 0, on ? 1 : 0.35);
  }
  txt(Math.round(G.score * easeInOut(clamp(G.overT / 1.4, 0, 1))).toLocaleString(), 0, -ph / 2 + 215 * u, 40 * u + 6, '#fff', 'center', 7, 900);
  if (G.newBest && G.overT > 1.4) txt('🏆 신기록!', 0, -ph / 2 + 250 * u, 17 * u + 4, `hsl(${(G.t * 200) % 360},95%,65%)`, 'center', 4, 900);
  const c = G.counts;
  txt(`정확도 ${(acc * 100).toFixed(1)}%  ·  최대 콤보 ${G.maxCombo}  ·  요리 ${G.dishes}`, 0, -ph / 2 + 280 * u, 13 * u + 2, '#e8d5e0', 'center', 0, 700);
  txt(`P ${c.perfect}  G ${c.great}  OK ${c.good}  MISS ${c.miss}`, 0, -ph / 2 + 302 * u, 12 * u + 2, '#b9a3c4', 'center', 0, 700);
  if (G.overT > 1.3) { const p = 1 + Math.sin(G.t * 5) * 0.06; ctx.scale(p, p); txt('👆 탭하여 다시 시작', 0, ph / 2 - 26 * u, 19 * u + 4, '#fff', 'center', 6, 900); }
  ctx.restore();
  if (grade === 'S' && G.overT > 1 && Math.random() < 0.3) burst(rand(0, W), -10, 3, ['#ff5d8f', '#ffd166', '#3ddc97', '#4cc9f0'], 120, 'conf');
}
function menuBtnRect() { return { x: 12, y: 12, w: 92, h: 36 }; }
function drawMenuBtn() {
  const b = menuBtnRect(), hov = ptr.x > b.x && ptr.x < b.x + b.w && ptr.y > b.y && ptr.y < b.y + b.h;
  ctx.save(); ctx.translate(b.x + b.w / 2, b.y + b.h / 2); const s = hov ? 1.08 : 1; ctx.scale(s, s);
  ctx.fillStyle = 'rgba(15,5,15,.75)'; rr(-b.w / 2, -b.h / 2, b.w, b.h, b.h / 2); ctx.fill();
  ctx.strokeStyle = '#ffd166'; ctx.lineWidth = 2; ctx.stroke(); txt('← 메뉴', 0, 1, 15, '#fff', 'center', 0, 800); ctx.restore();
}
function draw() {
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  drawBG();
  ctx.save();
  const z = 1 + G.zoom * 0.04 + G.barPulse * 0.006;
  ctx.translate(W / 2, H / 2); ctx.scale(z, z); ctx.translate(-W / 2, -H / 2);
  if (G.shake > 0) ctx.translate(rand(-1, 1) * G.shake, rand(-1, 1) * G.shake);
  drawLanes(); drawChef(); drawNotes(); drawParticles(); drawJudge();
  ctx.restore();
  if (G.mode !== 'title') drawHUD();
  drawTexts(); drawBanners();
  if (G.fever) { ctx.save(); ctx.lineWidth = 12; ctx.globalAlpha = 0.35 + 0.25 * G.pulse; ctx.strokeStyle = `hsl(${(G.t * 300) % 360},95%,60%)`; ctx.strokeRect(0, 0, W, H); ctx.restore(); }
  if (G.health < 25 && G.mode === 'play') {
    const vg = ctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.3, W / 2, H / 2, Math.max(W, H) * 0.75);
    vg.addColorStop(0, 'rgba(255,0,40,0)'); vg.addColorStop(1, `rgba(255,0,40,${0.2 + 0.12 * Math.sin(G.t * 8)})`); ctx.fillStyle = vg; ctx.fillRect(0, 0, W, H);
  }
  if (G.flash > 0) { ctx.globalAlpha = G.flash; ctx.fillStyle = G.flashColor; ctx.fillRect(0, 0, W, H); ctx.globalAlpha = 1; }
  if (G.mode === 'title') drawTitle();
  if (G.mode === 'over') drawOver();
  if (G.mode !== 'play') drawMenuBtn();
}

/* ---------- input ---------- */
function lanefromX(x) { return clamp(Math.floor((x - L.x0) / L.lw), 0, 3); }
function goMenu() { location.href = 'index.html'; }
cv.addEventListener('pointerdown', e => {
  e.preventDefault(); initAudio();
  const r = cv.getBoundingClientRect(), x = e.clientX - r.left, y = e.clientY - r.top; ptr.x = x; ptr.y = y;
  if (G.mode !== 'play') {
    const b = menuBtnRect(); if (x > b.x && x < b.x + b.w && y > b.y && y < b.y + b.h) { goMenu(); return; }
    if (G.mode === 'title' || G.overT > 1.3) start();
    return;
  }
  const l = lanefromX(x); touches.set(e.pointerId, l);
  try { cv.setPointerCapture(e.pointerId); } catch (_) {}
  press(l);
});
function up(e) { const l = touches.get(e.pointerId); if (l != null) { touches.delete(e.pointerId); if (![...touches.values()].includes(l)) release(l); } }
cv.addEventListener('pointerup', up); cv.addEventListener('pointercancel', up);
cv.addEventListener('pointermove', e => { const r = cv.getBoundingClientRect(); ptr.x = e.clientX - r.left; ptr.y = e.clientY - r.top; });
cv.addEventListener('contextmenu', e => e.preventDefault());
addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  if (k === 'escape') { goMenu(); return; }
  if (e.repeat) return;
  if (G.mode !== 'play') { if ((k === ' ' || k === 'enter') && (G.mode === 'title' || G.overT > 1.3)) start(); return; }
  if (k in KEYS) { e.preventDefault(); initAudio(); press(KEYS[k]); }
});
addEventListener('keyup', e => { const k = e.key.toLowerCase(); if (k in KEYS) release(KEYS[k]); });
document.addEventListener('visibilitychange', () => {
  if (!AC) return;
  if (document.hidden) AC.suspend(); else AC.resume();
});
addEventListener('resize', resize);

resize();
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  update(dt); draw(); requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
